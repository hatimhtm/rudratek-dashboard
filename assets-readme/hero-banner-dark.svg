  <rect x="0" y="0" width="1280" height="36" fill="#6366F1"/>
  <line x1="0" y1="36" x2="1280" y2="36" stroke="#FFFDF5" stroke-width="3"/>
  <text class="mono" x="640" y="24" text-anchor="middle" font-size="12" fill="#FFFDF5" letter-spacing="6">NEXT.JS 14 · TYPESCRIPT · TAILWIND · APP ROUTER · DARK MODE · ZERO RUNTIME CSS</text>

  <text class="mono" x="60" y="100" font-size="13" fill="#FFFDF5" letter-spacing="6">PROJECT OPERATIONS / DASHBOARD / V2 OVERHAUL</text>

  <text class="heading" x="60" y="250" font-size="160" fill="#FFFDF5" letter-spacing="-6">RUDRATEK<tspan fill="url(#r)">.</tspan></text>

  <text class="mono" x="60" y="310" font-size="14" fill="#FFFDF5" letter-spacing="4">/// PORTFOLIO STATS · STATUS DONUT · ACTIVITY FEED · ANALYTICS ///</text>

  <rect x="1080" y="80" width="140" height="140" fill="#CCFF00" stroke="#FFFDF5" stroke-width="6"/>
  <text class="mono" x="1150" y="138" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">DEEP</text>
  <text class="mono" x="1150" y="158" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">DASH</text>
  <text class="mono" x="1150" y="178" text-anchor="middle" font-size="13" fill="#1A1A1A" letter-spacing="2">BOARD</text>

  <text class="mono" x="60" y="378" font-size="12" fill="#FFFDF5" letter-spacing="4">/// ⌘+SEARCH · SPARKLINES · MILESTONES · TASKS · TEAM AVATARS ///</text>
